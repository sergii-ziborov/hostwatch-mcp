name: Go bridge

on:
  push:
    paths:
      - go.mod
      - cmd/**
      - internal/**
      - .github/workflows/go.yml
  pull_request:
    paths:
      - go.mod
      - cmd/**
      - internal/**
      - .github/workflows/go.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/hostwatch-mcp
