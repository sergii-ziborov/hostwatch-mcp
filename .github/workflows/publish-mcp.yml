name: Publish Hostwatch MCP

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install official publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish remote server
        run: ./mcp-publisher publish server.json
