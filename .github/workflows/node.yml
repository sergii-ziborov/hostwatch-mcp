name: Node bridge

on:
  push:
    paths:
      - package.json
      - node/**
      - .github/workflows/node.yml
  pull_request:
    paths:
      - package.json
      - node/**
      - .github/workflows/node.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run pack:check
